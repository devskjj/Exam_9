databaseChangeLog:
  - changeSet:
      id: 2
      author: wallet
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_user
                    references: users(id)

              - column:
                  name: amount
                  type: double
                  constraints:
                    nullable: false

              - column:
                  name: date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: counterparty
                  type: varchar(255)

              - column:
                  name: description
                  type: varchar(500)